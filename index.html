<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE_CORE_BOOT</title>
    <style>
        :root { --accent: #00D4FF; } /* The Pop of Colour */
        body { background: #050505; color: #fff; font-family: 'Courier New', monospace; padding: 10px; font-size: 16px; margin: 0; }
        
        #stage-1, #stage-2 { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 9999; padding: 20px; }
        .accent { color: var(--accent); }
        .module { border: 1px dashed var(--accent); padding: 10px; margin-bottom: 10px; }
        iframe { width: 100%; border: none; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="stage-1">
    <div id="log-1"></div>
</div>

<div id="stage-2" style="display:none;">
    <div id="log-2"></div>
</div>

<div id="dashboard" style="display:none;">
    <div class="module">
        <span class="accent">TIME:</span> <span id="time">--:--</span><br>
        <span class="accent">WEATHER:</span> <span id="weather">--</span><br>
        <span class="accent">MOOD:</span> <span id="mood">--</span>
    </div>

    <div class="module">
        <iframe id="player" src="https://open.spotify.com/embed/playlist/2GbIR2TAstFY3cg003yFgT?utm_source=generator" height="250"></iframe>
        <button onclick="cycle()" style="background:transparent; color:var(--accent); border:1px solid var(--accent); width:100%; padding:10px;">CYCLE</button>
    </div>

    <div class="module">
        <strong class="accent">[MOST PLAYED]</strong><br>
        RDR2: 160.6h | Rust: 95.8h | CP2077: 88.8h
    </div>
    
    <div class="module">
        <strong class="accent">[RECENT]</strong><br>
        No Man's Sky (27 May) | MK1 (23 May) | Titanfall 2 (9 May)
    </div>
</div>

<script>
    // STAGE 1: Slow load (800ms per line)
    const log1 = document.getElementById('log-1');
    const slow = ["Initializing Hardware...", "Verifying Integrity...", "Powering Vibe Core..."];
    let s = 0;
    const sInt = setInterval(() => {
        log1.innerHTML += `<div>> ${slow[s]}</div>`; s++;
        if(s >= slow.length) {
            clearInterval(sInt);
            document.getElementById('stage-1').style.display = 'none';
            document.getElementById('stage-2').style.display = 'block';
            runStage2();
        }
    }, 800);

    // STAGE 2: Rapid Jumble (50ms per line)
    function runStage2() {
        const log2 = document.getElementById('log-2');
        const rapid = ["KERN_A", "SYNC_B", "NET_C", "RAM_D", "IO_E", "VIBE_F", "READY"];
        let r = 0;
        const rInt = setInterval(() => {
            log2.innerHTML += `<div>> <span class="accent">${rapid[r]}</span>_0x${Math.floor(Math.random()*999)}</div>`; r++;
            if(r >= rapid.length) {
                clearInterval(rInt);
                document.getElementById('stage-2').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            }
        }, 50);
    }

    // Logic
    setInterval(() => document.getElementById('time').innerText = new Date().toLocaleTimeString(), 1000);
    fetch('https://api.open-meteo.com/v1/forecast?latitude=-34.9285&longitude=138.6007&current=temperature_2m')
        .then(r => r.json()).then(d => {
            document.getElementById('weather').innerText = d.current.temperature_2m + "C";
            document.getElementById('mood').innerText = (d.current.temperature_2m > 20) ? "SOLAR" : "LUNAR";
        });

    function cycle() {
        const p = document.getElementById('player');
        p.src = p.src.includes('0') ? 'https://open.spotify.com/embed/playlist/2CYaNy5UXj7YEC1ObftXgG?utm_source=generator' : 'https://open.spotify.com/embed/playlist/2GbIR2TAstFY3cg003yFgT?utm_source=generator';
    }
</script>
</body>
</html>
