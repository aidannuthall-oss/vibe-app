<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VIBE_CORE_FINAL</title>
<style>
    :root { --bg: #050505; --text: #00FF41; }
    body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; margin: 0; padding: 20px; overflow: hidden; }
    
    /* Auto-scrolling, self-cleaning terminal */
    #terminal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; padding: 20px; background: #050505; z-index: 9999; overflow: hidden; }
    .line { font-size: 20px; margin-bottom: 8px; border-left: 4px solid #00FF41; padding-left: 15px; }
    
    #dashboard { opacity: 0; animation: reveal 1s ease 10s forwards; height: 100vh; overflow-y: auto; padding-bottom: 50px; }
    @keyframes reveal { to { opacity: 1; } }
    
    .card { background: #0a0a0a; border: 1px solid #1a1a1a; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
    .status-bar { font-size: 16px; font-weight: bold; background: #111; padding: 15px; border-radius: 4px; display: flex; justify-content: space-between; }
    iframe { width: 100%; border: none; border-radius: 4px; }
    button { background: #00FF41; color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>

<div id="terminal"><div id="log"></div></div>

<div id="dashboard">
    <div id="status-bar" class="status-bar">
        <span id="time">TIME: --:--</span>
        <span>MOOD: FOCUSED</span>
        <span id="weather">WEATHER: LOADING...</span>
    </div>
    
    <div class="card">
        <iframe id="spotify-player" src="https://open.spotify.com/embed/playlist/2GbIR2TAstFY3cg003yFgT?utm_source=generator" height="352"></iframe>
        <button onclick="cycle()">CYCLE_PLAYLIST</button>
    </div>
    
    <div class="card" style="display:flex; gap: 20px;">
        <div id="top-games" style="flex:1;"><strong>MOST PLAYED:</strong></div>
        <div id="recent-games" style="flex:1;"><strong>LAST 5 PLAYED:</strong></div>
    </div>
</div>

<script>
    // 1. High Speed Auto-Scrolling Terminal
    const log = document.getElementById('log');
    function addLine(text) {
        const el = document.createElement('div');
        el.className = 'line';
        el.innerText = `[${new Date().toLocaleTimeString()}] > ${text}`;
        log.appendChild(el);
        if (log.children.length > 15) log.removeChild(log.firstChild); // Delete old lines
    }
    const msgs = ["INITIALIZING_CORE", "SYNCING_STEAM_DATA", "WEATHER_CALIBRATION", "MEMORY_FLUSH_COMPLETE"];
    for(let i=0; i<100; i++) {
        setTimeout(() => addLine(msgs[i % msgs.length]), i * 100);
    }
    setTimeout(() => { document.getElementById('terminal').style.display = 'none'; }, 10000);

    // 2. Steam Data (Manually set for accuracy)
    const topGames = ["CS2 (500h)", "BG3 (200h)", "Cyberpunk (120h)", "Elden Ring (85h)", "Stardew (40h)"];
    const lastPlayed = ["Elden Ring", "CS2", "Cyberpunk", "Hollow Knight", "Terraria"];
    document.getElementById('top-games').innerHTML += "<br>" + topGames.join("<br>");
    document.getElementById('recent-games').innerHTML += "<br>" + lastPlayed.join("<br>");

    // 3. Status Bar
    setInterval(() => {
        document.getElementById('time').innerText = `TIME: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
    }, 1000);
    fetch('https://api.open-meteo.com/v1/forecast?latitude=-34.9285&longitude=138.6007&current=temperature_2m')
        .then(r => r.json()).then(d => document.getElementById('weather').innerText = `WEATHER: ${d.current.temperature_2m}°C`);

    // 4. Playlist
    const links = ["https://open.spotify.com/embed/playlist/2GbIR2TAstFY3cg003yFgT?utm_source=generator", "https://open.spotify.com/embed/playlist/2CYaNy5UXj7YEC1ObftXgG?utm_source=generator", "https://open.spotify.com/embed/playlist/7jSnO8TrhskDCXGso3ssn2?utm_source=generator", "https://open.spotify.com/embed/playlist/0rzaHRMSw8JxmH8ALW9489?utm_source=generator"];
    let idx = 0;
    function cycle() { idx = (idx + 1) % links.length; document.getElementById('spotify-player').src = links[idx]; }
</script>
</body>
</html>
