<div class="vibe-card">
    <div class="vibe-card-label">Music Library</div>
    <div id="playlist-carousel">
        <iframe id="spotify-iframe" src="YOUR_FIRST_LINK" height="352" allow="encrypted-media"></iframe>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 10px;">
        <button onclick="prevPlaylist()" style="width: 45%;">Back</button>
        <button onclick="nextPlaylist()" style="width: 45%;">Next</button>
    </div>
</div>

<script>
    const playlistLinks = [
        "YOUR_FIRST_LINK",
        "YOUR_SECOND_LINK",
        "YOUR_THIRD_LINK"
    ];
    let currentIndex = 0;

    function nextPlaylist() {
        currentIndex = (currentIndex + 1) % playlistLinks.length;
        document.getElementById('spotify-iframe').src = playlistLinks[currentIndex];
    }

    function prevPlaylist() {
        currentIndex = (currentIndex - 1 + playlistLinks.length) % playlistLinks.length;
        document.getElementById('spotify-iframe').src = playlistLinks[currentIndex];
    }
</script>
