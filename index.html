<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBE_CORE_MOBILE</title>
<style>
    :root { --bg: #050505; --text: #FFFFFF; } /* Consistent white text */
    body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; margin: 0; padding: 10px; }
    
    /* Terminal: Now featuring white text */
    #terminal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; padding: 20px; background: #050505; z-index: 9999; display: flex; flex-direction: column-reverse; overflow: hidden; color: var(--text); }
    .line { font-size: 14px; margin-bottom: 5px; white-space: nowrap; color: var(--text); }
    
    #dashboard { opacity: 0; animation: reveal 1s ease 10s forwards; display: flex; flex-direction: column; gap: 10px; }
    @keyframes reveal { to { opacity: 1; } }
    
    .card { background: #1a1a1a; padding: 12px; border-radius: 8px; font-size: 12px; color: var(--text); }
    .status-bar { background: #000; padding: 10px; border: 1px solid #333; border-radius: 8px; text-align: center; }
    
    .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .list-item { border-bottom: 1px solid #333; padding: 4px 0; }
    
    iframe { width: 100%; border: none; border-radius: 8px; }
    button { background: #FFFFFF; color: #000; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 4px; }
</style>
</head>
<body>

<div id="terminal"><div id="log"></div></div>

<div id="dashboard">
    <div class="status-bar">
        <div id="date-time">--/--/-- --:--</div>
        <div id="weather-mood" style="margin-top:5px;">--</div>
        <div id="word-day" style="margin-top:5px; opacity: 0.7;">--</div>
    </div>
    
    <div class="card">
        <iframe id="spotify-player" src="https://open.spotify.com/embed/playlist/2GbIR2TAstFY3cg003yFgT?utm_source=generator" height="200"></iframe>
        <button onclick="cycle()">CYCLE PLAYLIST</button>
    </div>
    
    <div class="card">
        <div class="game-grid">
            <div><strong>[MOST PLAYED]</strong><br>
                <div class="list-item">RDR2: 160.6h</div>
                <div class="list-item">Rust: 95.8h</div>
                <div class="list-item">Cyberpunk: 88.8h</div>
            </div>
            <div><strong>[RECENTLY PLAYED]</strong><br>
                <div class="list-item">MK 1: 23 May</div>
                <div class="list-item">TF2: 9 May</div>
                <div class="list-item">Content: 6 May</div>
            </div>
        </div>
    </div>
</div>

<script>
    const log = document.getElementById('log');
    for(let i=0; i<150; i++) {
        setTimeout(() => {
            if (log.children.length > 20) log.removeChild(log.firstChild);
            const el = document.createElement('div');
            el.className = 'line';
            el.innerText = `> ${new Date().toLocaleTimeString()} :: CORE_SYNC_...`;
            log.appendChild(el);
        }, i * 50); 
    }
    setTimeout(() => { document.getElementById('terminal').style.display = 'none'; }, 9000);

    const words = [{w: "LIMINAL", d: "The threshold."}, {w: "SOLITUDE", d: "Peaceful alone-ness."}];
    const pick = words[Math.floor(Math.random()*words.length)];
    
    setInterval(() => {
        const now = new Date();
        document.getElementById('date-time').innerText = now.toLocaleDateString() + " " + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        document.getElementById('word-day').innerText = `${pick.w}: ${pick.d}`;
    }, 1000);

    fetch('https://api.open-meteo.com/v1/forecast?latitude=-34.9285&longitude=138.6007&current=temperature_2m')
        .then(r => r.json()).then(d => {
            const temp = d.current.temperature_2m;
            document.getElementById('weather-mood').innerText = `ADELAIDE: ${temp}°C | MOOD: ${temp > 20 ? 'SOLAR' : 'LUNAR'}`;
        });

    const links = ["https://open.spotify.com/embed/playlist/2GbIR2TAstFY3cg003yFgT?utm_source=generator", "https://open.spotify.com/embed/playlist/2CYaNy5UXj7YEC1ObftXgG?utm_source=generator"];
    let idx = 0;
    function cycle() { idx = (idx + 1) % links.length; document.getElementById('spotify-player').src = links[idx]; }
</script>
</body>
</html>
