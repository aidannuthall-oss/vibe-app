<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBE_CORE</title>
<style>
    :root { --bg: #050505; --text: #00FF41; }
    body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
    
    #terminal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; padding: 20px; background: #050505; z-index: 9999; overflow: auto; }
    .line { margin-bottom: 3px; font-size: 12px; opacity: 0; animation: fadein 0.1s forwards; }
    @keyframes fadein { to { opacity: 1; } }
    
    #dashboard { opacity: 0; animation: reveal 1s ease 10s forwards; }
    @keyframes reveal { to { opacity: 1; } }
    
    .card { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 4px; padding: 15px; margin-bottom: 15px; }
    iframe { width: 100%; border: none; border-radius: 4px; }
    button { background: #00FF41; color: #000; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; font-family: monospace; }
</style>
</head>
<body>

<div id="terminal"><div id="log"></div></div>

<div id="dashboard">
    <div style="font-size: 20px; margin-bottom: 10px;">> VIBE_CORE_ACTIVE</div>
    <div class="card">
        <div id="clock">--:--:--</div>
        <div id="weather">Loading weather...</div>
    </div>
    <div class="card">
        <iframe id="spotify-player" src="https://open.spotify.com/embed/playlist/2GbIR2TAstFY3cg003yFgT?utm_source=generator&theme=0" height="352"></iframe>
        <button onclick="cycle()" style="margin-top:10px;">CYCLE_PLAYLIST</button>
    </div>
    <div class="card">
        <a href="https://steamcommunity.com/profiles/76561199709660579" target="_blank">
            <button>ACCESS_STEAM_PROFILE</button>
        </a>
    </div>
</div>

<script>
    // Boot Sequence
    const log = document.getElementById('log');
    const commands = [
        "INITIALIZING VIBE_CORE...", "READING KERNEL_ARCH...", "CPU_TEMP: 42C", "MEM_CHK: 8192MB_OK", 
        "MOUNTING_DRIVE_01...", "CONNECTING TO NETWORK...", "IP: 192.168.1.105...", 
        "SYNCING_STEAM_ID: 76561199709660579...", "RESOLVING_ADELAIDE_WEATHER...", 
        "CALIBRATING_SENSORS...", "LINKING_SPOTIFY_API...", "AUTH_TOKEN_GEN: 0x884920...", 
        "HANDSHAKE: SUCCESS...", "TCP_IP: 192.168.1.105...", "LOGGING: USER_ADMIN...", 
        "SECURE_BOOT: ENABLED...", "LOAD_UI_ASSETS...", "RENDERING_DASHBOARD...", 
        "VIBE_CORE_READY...", "VIBE_CORE_ACTIVE."
    ];
    commands.forEach((t, i) => {
        setTimeout(() => {
            const el = document.createElement('div'); el.className = 'line';
            el.innerText = "> " + t; log.appendChild(el);
            window.scrollTo(0, document.body.scrollHeight);
        }, i * 450); 
    });
    setTimeout(() => { document.getElementById('terminal').style.display = 'none'; }, 9500);

    // Dashboard Data
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    fetch('https://api.open-meteo.com/v1/forecast?latitude=-34.9285&longitude=138.6007&current=temperature_2m')
        .then(r => r.json()).then(d => document.getElementById('weather').innerText = `ADELAIDE: ${d.current.temperature_2m}°C`);

    // Playlist Logic (Add more links here to cycle through them)
    const links = ["https://open.spotify.com/embed/playlist/2GbIR2TAstFY3cg003yFgT?utm_source=generator&theme=0"];
    let i = 0;
    function cycle() { i = (i + 1) % links.length; document.getElementById('spotify-player').src = links[i]; }
</script>
</body>
</html>
