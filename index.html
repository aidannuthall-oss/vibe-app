<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE_CORE_v3.2</title>
    <style>
        :root { 
            --accent: #00D4FF; 
            --bg: #050505; 
            --panel: #111111;
        }
        
        body { 
            background: var(--bg); 
            color: #ffffff; 
            font-family: 'Courier New', monospace; 
            padding: 15px; 
            margin: 0; 
            overflow-x: hidden;
            user-select: none; 
            -webkit-user-select: none;
        }

        body.flash-active {
            animation: system-flash 0.2s ease-out forwards;
        }
        @keyframes system-flash {
            0% { background: #ffffff; }
            100% { background: var(--bg); }
        }
        
        #stage-1, #stage-2 { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--bg); 
            z-index: 9999; 
            padding: 20px 10px 20px 2px;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        
        .term-line { 
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 4px; 
            white-space: nowrap;
        }

        #dashboard { 
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            display: flex; 
            flex-direction: column; 
            gap: 15px;
            padding-bottom: 30px;
        }
        
        .bubble-module { 
            background: var(--panel); 
            padding: 18px; 
            border-radius: 24px; 
            border: 1px solid #222222; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s ease, border-color 0.2s ease;
        }
        
        .clickable-window {
            cursor: pointer;
            text-align: center;
        }
        .clickable-window:active {
            transform: scale(0.97);
            border-color: var(--accent);
        }

        .accent { 
            color: var(--accent); 
            font-weight: bold;
        }

        .list-header {
            color: var(--accent);
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 10px;
            border-bottom: 1px dashed #333333;
            padding-bottom: 4px;
        }

        /* Dynamic File Directory Elements */
        .directory-row {
            padding: 10px 5px;
            border-bottom: 1px dashed #222222;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        .directory-row:active {
            color: var(--accent);
        }

        button { 
            background: #000000; 
            color: var(--accent); 
            border: 1px solid var(--accent); 
            width: 100%; 
            padding: 12px; 
            border-radius: 12px; 
            font-weight: bold; 
            font-family: 'Courier New', monospace;
            font-size: 14px;
            cursor: pointer; 
            transition: all 0.1s ease;
        }
        button:active {
            transform: scale(0.95);
            background: var(--accent);
            color: #000;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .audio-controls {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div id="stage-1">
    <div id="log-1"></div>
</div>

<div id="stage-2" style="display:none;">
    <div id="log-2"></div>
</div>

<div id="dashboard" style="display:none;">
    
    <div class="bubble-module">
        <span class="accent">SYS_TIME:</span> <span id="time">--:--:--</span><br>
        <span class="accent">METEO_LOC:</span> <span id="weather">--.-°C</span><br>
        <span class="accent">CORE_MOOD:</span> <span id="mood">INITIALIZING</span><br>
        <span class="accent">SYS_WOTD:</span> <span id="wotd" style="font-style: italic;">LOADING...</span>
    </div>

    <div class="bubble-module clickable-window" onclick="window.location.href='https://www.instagram.com/direct/inbox/'">
        <div class="list-header" style="text-align: left;"><span class="status-dot"></span>[COMMS_NODE: INSTAGRAM]</div>
        <div style="padding: 15px 0;">
            <span style="font-size: 28px;">✉️</span><br>
            <span style="font-size: 13px; color: #888; font-weight: bold; margin-top: 10px; display: inline-block;">
                > INTERCEPT ACTIVE <br>
                [ TAP TO SECURE INBOX ]
            </span>
        </div>
    </div>

    <div class="bubble-module">
        <div class="list-header">[LOCAL_AUDIO_DAEMON]</div>
        
        <div style="margin-bottom: 12px;">
            <div><span class="accent">TARGET_DIR:</span> <span id="dir-display">/root</span></div>
            <div><span class="accent">ACTIVE_TRK:</span> <span id="track-display">SYSTEM_IDLE</span></div>
        </div>
        
        <audio id="local-player" style="display:none;" onended="nextTrack()"></audio>

        <div id="directory-view" style="max-height: 180px; overflow-y: auto; margin-bottom: 10px;">
            </div>
        
        <div id="directory-back-btn" style="display: none; margin-bottom: 10px;">
            <button onclick="renderFolderView()">[ .. BACK TO ROOT ]</button>
        </div>
        
        <div class="audio-controls">
            <button onclick="prevTrack()">[ |<< ]</button>
            <button onclick="togglePlay()" id="play-btn">[ PLAY ]</button>
            <button onclick="nextTrack()">[ >>| ]</button>
        </div>
    </div>

    <div class="bubble-module">
        <div class="list-header">[APP_LAUNCH_MATRIX]</div>
        <div class="button-grid">
            <button onclick="window.location.href='https://open.spotify.com/collection/playlists'">SPOTIFY_SYS</button>
            <button onclick="window.location.href='https://discord.com/app'">DISCORD</button>
            <button onclick="window.location.href='https://youtube.com'">YOUTUBE</button>
            <button onclick="window.location.href='steam://open/main'">STEAM</button>
        </div>
    </div>
</div>

<script>
    // GLOBAL BOOT TIMERS
    let stage1Interval, stage1Timeout, stage2Interval, stage2Timeout;
    let isBooting = true;

    // Secret Double-Tap Skip Mechanism
    let lastTap = 0;
    document.addEventListener('touchend', function(e) {
        if(!isBooting) return;
        let currentTime = new Date().getTime();
        let tapLength = currentTime - lastTap;
        if (tapLength < 500 && tapLength > 0) {
            skipBootSequence();
            e.preventDefault();
        }
        lastTap = currentTime;
    });
    document.addEventListener('dblclick', () => { if(isBooting) skipBootSequence(); });

    function skipBootSequence() {
        isBooting = false;
        clearInterval(stage1Interval);
        clearInterval(stage2Interval);
        clearTimeout(stage1Timeout);
        clearTimeout(stage2Timeout);
        document.body.classList.remove('flash-active');
        document.getElementById('stage-1').style.display = 'none';
        document.getElementById('stage-2').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
    }

    // Terminal logic
    function appendTerminalLine(targetId, text, maxLines = 22) {
        const container = document.getElementById(targetId);
        if (!container) return;
        if (container.children.length >= maxLines) {
            container.removeChild(container.firstChild);
        }
        const line = document.createElement('div');
        line.className = 'term-line';
        line.innerHTML = text;
        container.appendChild(line);
    }

    // STAGE 1 LOGIC (6000ms)
    const log1Target = "log-1";
    const stage1Commands = [
        "root@vibe_core:~# ./init_hardware_handshake.sh",
        "[-] Checking storage array layout... OK",
        "[-] Initializing logic threshold matrix...",
        "[-] Mounting Adelaide local server cluster...",
        "[-] Bypassing external DRM protocols...",
        "[-] Verifying local user configuration rules...",
        "[-] System core diagnostic path verified safe."
    ];
    
    let sIdx = 0;
    stage1Interval = setInterval(() => {
        if (sIdx < stage1Commands.length) {
            appendTerminalLine(log1Target, `> ${stage1Commands[sIdx]}`);
            sIdx++;
        } else {
            appendTerminalLine(log1Target, `> [!] Pinging sub-kernels... standard timeout loop forced.`);
        }
    }, 800);

    stage1Timeout = setTimeout(() => {
        if(!isBooting) return;
        clearInterval(stage1Interval);
        document.body.classList.add('flash-active');
        document.getElementById('stage-1').style.display = 'none';
        document.getElementById('stage-2').style.display = 'block';
        setTimeout(() => document.body.classList.remove('flash-active'), 200);
        runStage2();
    }, 6000);

    // STAGE 2 LOGIC (4000ms)
    function runStage2() {
        if(!isBooting) return;
        const log2Target = "log-2";
        const modules = ["SYS", "KERN", "NET", "MMU", "DRV", "API", "UI"];
        const hexCodes = ["0x3F", "0xA1", "0xBC", "0xFF", "0x00", "0x7E", "0x4D"];
        
        stage2Interval = setInterval(() => {
            const randomModule = modules[Math.floor(Math.random() * modules.length)];
            const randomHex = Math.floor(Math.random() * 65535).toString(16).toUpperCase();
            const randomStatus = hexCodes[Math.floor(Math.random() * hexCodes.length)];
            
            const layout = `[${new Date().toLocaleTimeString()}] <span class="accent">${randomModule}</span>::ALLOC_MEM_SECTOR_${randomHex} -> STATUS_${randomStatus}_OK`;
            appendTerminalLine(log2Target, layout, 25);
        }, 50);

        stage2Timeout = setTimeout(() => {
            if(!isBooting) return;
            isBooting = false;
            clearInterval(stage2Interval);
            document.getElementById('stage-2').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
        }, 4000);
    }

    // DASHBOARD CORE CLOCK & ENVIRONMENT ENGINES
    setInterval(() => {
        document.getElementById('time').innerText = new Date().toLocaleTimeString();
    }, 1000);

    const wotdList = [
        { w: "PROFOUND", d: "Having deep insight or knowledge." },
        { w: "VOLATILE", d: "Liable to change rapidly and unpredictably." },
        { w: "RESILIENT", d: "Able to withstand or recover from harsh states." },
        { w: "EPIPHANY", d: "A sudden, intuitive perception or reality shift." },
        { w: "TACITURN", d: "Reserved or uncommunicative in nature." }
    ];
    const pickedWotd = wotdList[Math.floor(Math.random() * wotdList.length)];
    document.getElementById('wotd').innerText = `${pickedWotd.w} - ${pickedWotd.d}`;

    fetch('https://api.open-meteo.com/v1/forecast?latitude=-34.9285&longitude=138.6007&current=temperature_2m')
        .then(response => response.json())
        .then(data => {
            const currentTemp = data.current.temperature_2m;
            const currentHour = new Date().getHours();
            let parsedEmotion = "CONTENT";

            if (currentHour >= 23 || currentHour < 5) {
                parsedEmotion = "MELANCHOLIC"; 
            } else if (currentTemp < 14) {
                parsedEmotion = "SOMBER";
            } else if (currentTemp >= 14 && currentTemp <= 22) {
                parsedEmotion = "CHILL";
            } else if (currentTemp > 22 && currentTemp <= 28) {
                parsedEmotion = "ENERGIZED";
            } else {
                parsedEmotion = "RESTLESS";
            }
            document.getElementById('weather').innerText = `${currentTemp}°C`;
            document.getElementById('mood').innerText = parsedEmotion;
        })
        .catch(() => {
            document.getElementById('mood').innerText = "APATHETIC";
        });

    // -----------------------------------------------------------------
    // PROGRAMMABLE FOUR-FOLDER AUDIO SYSTEM DATA STRUCTURE
    // Add file names and track labels inside these lists as you collect files.
    // -----------------------------------------------------------------
    const playlistFolders = [
        {
            folderName: "PLAYLIST_0",
            tracks: [
                { file: "p0_song1.mp3", name: "P0_TRK_ALPHA" },
                { file: "p0_song2.mp3", name: "P0_TRK_BRAVO" }
            ]
        },
        {
            folderName: "PLAYLIST_1",
            tracks: [
                { file: "p1_song1.mp3", name: "P1_TRK_ALPHA" }
            ]
        },
        {
            folderName: "PLAYLIST_2",
            tracks: [
                { file: "p2_song1.mp3", name: "P2_TRK_ALPHA" }
            ]
        },
        {
            folderName: "PLAYLIST_3",
            tracks: [
                { file: "p3_song1.mp3", name: "P3_TRK_ALPHA" }
            ]
        }
    ];
    
    let activeFolderIdx = null;
    let currentTrackIdx = 0;
    
    const player = document.getElementById('local-player');
    const playBtn = document.getElementById('play-btn');
    const trackDisplay = document.getElementById('track-display');
    const dirDisplay = document.getElementById('dir-display');
    const dirView = document.getElementById('directory-view');
    const backBtn = document.getElementById('directory-back-btn');

    // Build the Primary Parent Folder Directory Layout
    function renderFolderView() {
        activeFolderIdx = null;
        dirDisplay.innerText = "/root";
        backBtn.style.display = "none";
        dirView.innerHTML = "";
        
        playlistFolders.forEach((folder, index) => {
            const row = document.createElement('div');
            row.className = "directory-row";
            row.innerHTML = `<span>📁 ${folder.folderName}/</span> <span class="accent">[${folder.tracks.length} OBJ]</span>`;
            row.onclick = () => renderFileView(index);
            dirView.appendChild(row);
        });
    }

    // Drill down inside a targeted folder array object
    function renderFileView(folderIdx) {
        activeFolderIdx = folderIdx;
        const currentFolder = playlistFolders[folderIdx];
        dirDisplay.innerText = `/root/${currentFolder.folderName}`;
        backBtn.style.display = "block";
        dirView.innerHTML = "";
        
        if(currentFolder.tracks.length === 0 || currentFolder.tracks[0].file === "") {
            dirView.innerHTML = `<div style="padding: 10px; color: #555;">[ DIRECTORY EMPTY ]</div>`;
            return;
        }

        currentFolder.tracks.forEach((track, index) => {
            const row = document.createElement('div');
            row.className = "directory-row";
            row.innerHTML = `<span>🎵 ${track.name}</span> <span class="accent">.MP3</span>`;
            row.onclick = () => selectAndPlayTrack(index);
            dirView.appendChild(row);
        });
    }

    function selectAndPlayTrack(trackIdx) {
        currentTrackIdx = trackIdx;
        const activeTrack = playlistFolders[activeFolderIdx].tracks[currentTrackIdx];
        
        player.src = activeTrack.file;
        trackDisplay.innerText = `${playlistFolders[activeFolderIdx].folderName} -> ${activeTrack.name}`;
        
        player.play();
        playBtn.innerText = "[ PAUSE ]";
        playBtn.style.background = "var(--accent)";
        playBtn.style.color = "#000";
    }

    function togglePlay() {
        if (activeFolderIdx === null) {
            // If no folder is selected, automatically default launch the first setup
            activeFolderIdx = 0;
        }
        if (!player.src) {
            selectAndPlayTrack(0);
            return;
        }
        
        if (player.paused) {
            player.play();
            playBtn.innerText = "[ PAUSE ]";
            playBtn.style.background = "var(--accent)";
            playBtn.style.color = "#000";
        } else {
            player.pause();
            playBtn.innerText = "[ PLAY ]";
            playBtn.style.background = "#000";
            playBtn.style.color = "var(--accent)";
        }
    }

    function nextTrack() {
        if (activeFolderIdx === null) return;
        const totalTracks = playlistFolders[activeFolderIdx].tracks.length;
        currentTrackIdx = (currentTrackIdx + 1) % totalTracks;
        selectAndPlayTrack(currentTrackIdx);
    }

    function prevTrack() {
        if (activeFolderIdx === null) return;
        const totalTracks = playlistFolders[activeFolderIdx].tracks.length;
        currentTrackIdx = (currentTrackIdx - 1 + totalTracks) % totalTracks;
        selectAndPlayTrack(currentTrackIdx);
    }

    // Initialize Root Directory UI State on application lifecycle creation
    renderFolderView();
</script>
</body>
</html>
