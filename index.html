<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE_CORE</title>
    <style>
        body { background: #050505; color: #FFFFFF; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        #terminal { font-size: 14px; margin-bottom: 20px; }
        .line { margin-bottom: 5px; }
        .card { background: #1a1a1a; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        .status-bar { background: #000; padding: 10px; border: 1px solid #333; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>

<div id="terminal">
    <div id="log"></div>
</div>

<div id="dashboard">
    <div class="status-bar">
        <div id="date-time">LOADING...</div>
        <div id="weather-mood">ADELAIDE: -- | MOOD: --</div>
    </div>
    
    <div class="card">
        <iframe id="spotify-player" src="https://open.spotify.com/embed/playlist/2GbIR2TAstFY3cg003yFgT?utm_source=generator" width="100%" height="200" style="border:none;"></iframe>
        <button onclick="cycle()" style="width:100%; padding:10px; margin-top:5px;">CYCLE PLAYLIST</button>
    </div>

    <div class="card">
        <strong>[MOST PLAYED]</strong>
        <div>RDR2: 160.6 hrs</div>
        <div>Rust: 95.8 hrs</div>
        <div>Cyberpunk 2077: 88.8 hrs</div>
        <br>
        <strong>[RECENTLY PLAYED]</strong>
        <div>Mortal Kombat 1</div>
        <div>Titanfall 2</div>
        <div>Content Warning</div>
    </div>
</div>

<script>
    // 1. Visible Terminal
    const log = document.getElementById('log');
    const msgs = ["CORE_INIT", "SYNC_STEAM", "WEATHER_API", "READY"];
    for(let i=0; i<10; i++) {
        const el = document.createElement('div');
        el.className = 'line';
        el.innerText = `> ${msgs[i%msgs.length]} : 0x${Math.floor(Math.random()*9999)}`;
        log.appendChild(el);
    }

    // 2. Data
    setInterval(() => {
        document.getElementById('date-time').innerText = new Date().toLocaleString();
    }, 1000);

    fetch('https://api.open-meteo.com/v1/forecast?latitude=-34.9285&longitude=138.6007&current=temperature_2m')
        .then(r => r.json()).then(d => {
            document.getElementById('weather-mood').innerText = `ADELAIDE: ${d.current.temperature_2m}°C | MOOD: NEUTRAL`;
        });

    function cycle() {
        const player = document.getElementById('spotify-player');
        player.src = player.src.includes('7') ? 'https://open.spotify.com/embed/playlist/2CYaNy5UXj7YEC1ObftXgG?utm_source=generator' : 'https://open.spotify.com/embed/playlist/2GbIR2TAstFY3cg003yFgT?utm_source=generator';
    }
</script>
</body>
</html>
