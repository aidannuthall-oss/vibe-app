    /* Centered Terminal */
    #terminal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; padding: 20px; background: #050505; z-index: 9999; display: flex; flex-direction: column-reverse; overflow: hidden; justify-content: center; }

    #dashboard { opacity: 0; animation: reveal 1s ease 10s forwards; width: 100%; max-width: 400px; }
    @keyframes reveal { to { opacity: 1; } }

    .list-title { font-weight: bold; margin-top: 10px; border-bottom: 1px solid #555; }
    .list-item { padding: 4px 0; border-bottom: 1px solid #222; }
    
    iframe { width: 100%; border: none; border-radius: 8px; }
    button { background: #FFFFFF; color: #000; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 4px; }
</style>
