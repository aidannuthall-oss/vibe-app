<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBE_CORE_MOBILE</title>
<style>
    :root { --bg: #050505; --text: #FFFFFF; }
    body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; margin: 0; padding: 10px; }
    
    #terminal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; padding: 15px; background: #050505; z-index: 9999; display: flex; flex-direction: column-reverse; overflow: hidden; }
    .line { font-size: 13px; margin-bottom: 4px; white-space: nowrap; }
    
    #dashboard { opacity: 0; animation: reveal 1s ease 10s forwards; display: flex; flex-direction: column; gap: 10px; }
    @keyframes reveal { to { opacity: 1; } }
    
    .card { background: #1a1a1a; padding: 12px; border-radius: 8px; font-size: 12px; }
    .status-bar { background: #000; padding: 10px; border: 1px solid #333; border-radius: 8px; text-align: center; }
    
    /* Stacked lists for vertical mobile fit */
    .list-title { font-weight: bold; margin-top: 10px; border-bottom: 1px solid #555; padding-bottom: 2px; }
    .list-item { padding: 4px 0; border-bottom: 1px solid #222; }
    
    iframe { width: 100%; border: none; border-radius: 8px; }
    button { background: #FFFFFF; color: #000; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 4px; }
</style>
</head>
