<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    body { background: #050505; color: #00FF41; font-family: 'Courier New', monospace; margin: 0; }
    
    /* The Rugged Loader */
    #terminal {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        padding: 20px; box-sizing: border-box; overflow: hidden;
        z-index: 9999; background: #050505;
    }
    
    /* The Dashboard - Hidden until boot */
    #dashboard { opacity: 0; animation: reveal 0.5s ease 10s forwards; padding: 20px; }
    @keyframes reveal { to { opacity: 1; } }

    .line { margin-bottom: 5px; opacity: 0; animation: typing 0.5s forwards; }
    @keyframes typing { to { opacity: 1; } }
</style>
</head>
<body>

<div id="terminal">
    <div id="log"></div>
</div>

<div id="dashboard">
    <h1>VIBE_CORE_ACTIVE</h1>
</div>

<script>
    const log = document.getElementById('log');
    const lines = [
        "INITIALIZING VIBE_CORE...",
        "CONNECTING TO STEAM_API_NODE...",
        "AUTHENTICATING USER_ID: 76561199709660579...",
        "SYNCING SPOTIFY_EMBED_MODULES...",
        "CALIBRATING WEATHER_API_ADELAIDE...",
        "LOADING PERSONAL_PREFERENCES...",
        "CHECKING FOR SYSTEM_VULNERABILITIES...",
        "VIBE_CORE_READY."
    ];

    lines.forEach((text, i) => {
        setTimeout(() => {
            const el = document.createElement('div');
            el.className = 'line';
            el.innerText = "> " + text;
            log.appendChild(el);
        }, i * 1200); // Staggers the lines over ~10 seconds
    });

    // Hide terminal after 10s
    setTimeout(() => {
        document.getElementById('terminal').style.display = 'none';
    }, 10000);
</script>
</body>
</html>
