<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BOOT_SEQ</title>
    <style>
        body { background: #050505; color: #fff; font-family: 'Courier New', monospace; padding: 20px; }
        .line { margin-bottom: 5px; }
    </style>
</head>
<body>
    <div id="log"></div>
    <script>
        const log = document.getElementById('log');
        const lines = ["INIT KERNEL...", "SYNC STEAM_DB...", "MOUNT WEATHER_API...", "CALIBRATE VIBE...", "REDIRECTING..."];
        let i = 0;
        const interval = setInterval(() => {
            if (i >= lines.length) {
                window.location.href = "index.html";
                clearInterval(interval);
            } else {
                log.innerHTML += `<div class="line">> ${lines[i]}</div>`;
                i++;
            }
        }, 800);
    </script>
</body>
</html>
